# Tiny Tapeout project information
project:
  title:        "ALU with 7-Segment Display"   # عدّل العنوان زي ما تحب
  author:       "Ahmed ELmallah"      # اكتب اسمك هنا
  discord:      ""      # اكتب يوزر الديسكورد بتاعك هنا (اختياري)
  description:  "8-bit ALU controlled by push buttons and switches, with result shown on a multiplexed 7-segment display"
  language:     "Verilog"
  clock_hz:     0        # حط تردد الكلوك الفعلي بتاعك هنا لو معروف (مثلاً 50000000 لو 50MHz)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_example"

  # List your project's source files here.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "sw[0]"
  ui[1]: "sw[1]"
  ui[2]: "sw[2]"
  ui[3]: "sw[3]"
  ui[4]: "sw[4]"
  ui[5]: "sw[5]"
  ui[6]: "sw[6]"
  ui[7]: "sw[7]"

  # Outputs
  uo[0]: "SEG_A"
  uo[1]: "SEG_B"
  uo[2]: "SEG_C"
  uo[3]: "SEG_D"
  uo[4]: "SEG_E"
  uo[5]: "SEG_F"
  uo[6]: "SEG_G"
  uo[7]: "SEG_DP"

  # Bidirectional pins
  uio[0]: "pb1"
  uio[1]: "pb2"
  uio[2]: "pb3"
  uio[3]: "AN0"
  uio[4]: "AN1"
  uio[5]: "AN2"
  uio[6]: "AN3"
  uio[7]: ""

# Do not change!
yaml_version: 6
