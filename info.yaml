# Tiny Tapeout project information
project:
  title:        "8-bit ALU with 7-Segment Display"
  author:       "Ahmed ELmallah"
  discord:      ""
  description:  "An 8-bit ALU controlled by switches and push buttons, with the result displayed on a multiplexed 4-digit 7-segment display."
  language:     "Verilog"
  clock_hz:     0

  # How many tiles your design occupies?
  tiles: "1x1"

  top_module:  "tt_um_example"

  source_files:
    - "project.v"

# The pinout of your project.
pinout:
  # Inputs
  ui[0]: "SW0"
  ui[1]: "SW1"
  ui[2]: "SW2"
  ui[3]: "SW3"
  ui[4]: "SW4"
  ui[5]: "SW5"
  ui[6]: "SW6"
  ui[7]: "SW7"

  # Outputs
  uo[0]: "SEG_A"
  uo[1]: "SEG_B"
  uo[2]: "SEG_C"
  uo[3]: "SEG_D"
  uo[4]: "SEG_E"
  uo[5]: "SEG_F"
  uo[6]: "SEG_G"
  uo[7]: "SEG_DP"

  # Bidirectional pins
  uio[0]: "PB1"
  uio[1]: "PB2"
  uio[2]: "PB3"
  uio[3]: "AN0"
  uio[4]: "AN1"
  uio[5]: "AN2"
  uio[6]: "AN3"
  uio[7]: ""

# Do not change!
yaml_version: 6
